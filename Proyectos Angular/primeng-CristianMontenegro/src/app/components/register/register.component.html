<div class="p-fluid">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
  
  
      <div class="p-field">
        <label for="email">user</label>
        <input id="email" type="email" pInputText formControlName="username" />
        <div *ngIf="registerForm.controls['username'].invalid && registerForm.controls['username'].touched" class="error">
          Usuario no valido
        </div>
      </div>
  
      <div class="p-field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" pPassword formControlName="password" />
        <div *ngIf="registerForm.controls['password'].invalid && registerForm.controls['password'].touched" class="error">
          La contraseña debe tener al menos 6 caracteres
        </div>
      </div>
  
      <button pButton type="submit" label="Registrar" [disabled]="registerForm.invalid"></button>
    </form>
  </div>
